# ==================================================
# OncoVision AI — Docker Compose (local / dev)
# ==================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oncovision}
    volumes:
      - oncovision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oncovision}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oncovision_net

  backend:
    container_name: oncovision-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - oncovision_uploads:/app/storage/uploads
      - oncovision_reports:/app/storage/reports
      - oncovision_models:/app/storage/models
      - oncovision_logs:/app/logs
    networks:
      - oncovision_net

  frontend:
    container_name: oncovision-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - oncovision_net

volumes:
  oncovision_pgdata:
  oncovision_uploads:
  oncovision_reports:
  oncovision_models:
  oncovision_logs:

networks:
  oncovision_net:
    driver: bridge