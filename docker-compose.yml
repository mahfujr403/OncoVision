services:
  backend:
    container_name: oncovision-backend
    image: oncovision/backend:dev

    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    restart: unless-stopped


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload